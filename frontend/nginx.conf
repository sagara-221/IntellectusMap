# ==============================================================================
# Nginx サーバー設定
# 用途: SPAルーティングのフォールバックおよびバックエンドAPIへのリバースプロキシ
# ==============================================================================
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # バックエンドAPIへのリバースプロキシ（SSEストリーミング用にタイムアウト240秒確保）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 240s;
    }

    # SPA (Single Page Application) ルーティング用フォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }
}

